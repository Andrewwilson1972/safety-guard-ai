kind = "web"
previewPath = "/"
title = "Worker Safety Monitor"
version = "1.0.0"
id = "artifacts/worker-safety"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25468

[services.development]
run = "pnpm --filter @workspace/worker-safety run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/worker-safety", "run", "build" ]
publicDir = "frontend/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25468"
BASE_PATH = "/"
